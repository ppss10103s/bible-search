<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ 咻咻查聖經 2.0 ✦</title>
  <link rel="icon" href="data:,">
  <style>
    /* === 1. 基礎設定 & 變數 === */
    :root {
      --primary-color: #5d4037;
      --accent-color: #8d6e63;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --highlight-color: #fff9c4;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    /* === 2. 佈局容器 === */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* === 3. 卡片式設計 === */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* === 4. 輸入框與按鈕 === */
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      width: 100%;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    button:hover {
      background-color: #4e342e;
    }
    
    /* 分頁按鈕樣式 */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
        align-items: center;
    }
    
    .page-btn {
        background-color: #fff;
        color: var(--primary-color);
        border: 1px solid var(--primary-color);
        padding: 8px 16px;
        font-size: 14px;
    }
    
    .page-btn:disabled {
        border-color: #ccc;
        color: #ccc;
        cursor: not-allowed;
    }
    
    .page-btn:hover:not(:disabled) {
        background-color: var(--primary-color);
        color: #fff;
    }

    /* === 5. 搜尋結果列表 === */
    .result-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item:last-child { border-bottom: none; }

    .verse-ref {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.95rem;
    }

    .verse-text {
      font-size: 1.05rem;
      text-align: justify;
    }

    .highlight { 
      background-color: var(--highlight-color); 
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* === 6. 複製按鈕優化 === */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .copy-btn {
      background-color: transparent;
      color: #777;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
    }

    .copy-btn:hover {
      background-color: #f0f0f0;
      color: #333;
    }

    /* === 7. Toast 提示 === */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 12px;
      position: fixed;
      z-index: 99;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
    
    /* === 響應式調整 === */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .card { padding: 15px; }
      h1 { font-size: 1.5rem; }
      #keywordBtn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✦ 咻咻查聖經 2.0 ✦</h1>
  <p class="subtitle">支援：太六3、6:3 (全書卷搜尋)、關鍵字分頁</p>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">經文查詢</label>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="範例：太六3、6:3、詩23">
    </div>
    <div id="result" style="margin-top: 15px;"></div>
  </div>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">關鍵字查詢</label>
    <div class="search-group">
      <input type="text" id="keywordInput" placeholder="輸入關鍵字 (空格分隔多個詞)">
      <button id="keywordBtn">搜尋</button>
    </div>
    <div id="keywordResult" style="margin-top: 15px;"></div>
    <div id="paginationContainer" class="pagination" style="display:none;"></div>
  </div>
</div>

<div id="toast" class="toast">已複製經文</div>

<script>
  // === 卷名對照 ===
  const bookMap = {
    '創':'Gen','創世記':'Gen', '出':'Exo','出埃及記':'Exo', '利':'Lev','利未記':'Lev',
    '民':'Num','民數記':'Num', '申':'Deu','申命記':'Deu', '書':'Jos','約書亞記':'Jos',
    '士':'Jug','士師記':'Jug', '得':'Rut','路得記':'Rut', '撒上':'1Sa','撒母耳記上':'1Sa',
    '撒下':'2Sa','撒母耳記下':'2Sa', '王上':'1Ki','列王記上':'1Ki', '王下':'2Ki','列王記下':'2Ki',
    '代上':'1Ch','歷代志上':'1Ch', '代下':'2Ch','歷代志下':'2Ch', '拉':'Ezr','以斯拉記':'Ezr',
    '尼':'Neh','尼希米記':'Neh', '斯':'Est','以斯帖記':'Est', '伯':'Job','約伯記':'Job',
    '詩':'Psm','詩篇':'Psm', '箴':'Pro','箴言':'Pro', '傳':'Ecc','傳道書':'Ecc',
    '歌':'Son','雅歌':'Son', '賽':'Isa','以賽亞書':'Isa', '耶':'Jer','耶利米書':'Jer',
    '哀':'Lam','耶利米哀歌':'Lam', '結':'Eze','以西結書':'Eze', '但':'Dan','但以理書':'Dan',
    '何':'Hos','何西阿書':'Hos', '珥':'Joe','約珥書':'Joe', '摩':'Amo','阿摩司書':'Amo',
    '俄':'Oba','俄巴底亞書':'Oba', '拿':'Jon','約拿書':'Jon', '彌':'Mic','彌迦書':'Mic',
    '鴻':'Nah','那鴻書':'Nah', '哈':'Hab','哈巴谷書':'Hab', '番':'Zep','西番雅書':'Zep',
    '該':'Hag','哈該書':'Hag', '亞':'Zec','撒迦利亞書':'Zec', '瑪':'Mal','瑪拉基書':'Mal',
    '太':'Mat','馬太福音':'Mat', '可':'Mak','馬可福音':'Mak', '路':'Luk','路加福音':'Luk',
    '約':'Jhn','約翰福音':'Jhn', '徒':'Act','使徒行傳':'Act', '羅':'Rom','羅馬書':'Rom',
    '林前':'1Co','哥林多前書':'1Co', '林後':'2Co','哥林多後書':'2Co', '加':'Gal','加拉太書':'Gal',
    '弗':'Eph','以弗所書':'Eph', '腓':'Phl','腓立比書':'Phl', '西':'Col','歌羅西書':'Col',
    '帖前':'1Ts','帖撒羅尼迦前書':'1Ts', '帖後':'2Ts','帖撒羅尼迦後書':'2Ts', '提前':'1Ti','提摩太前書':'1Ti',
    '提後':'2Ti','提摩太後書':'2Ti', '多':'Tit','提多書':'Tit', '門':'Phm','腓利門書':'Phm',
    '來':'Heb','希伯來書':'Heb', '雅':'Jas','雅各書':'Jas', '彼前':'1Pe','彼得前書':'1Pe',
    '彼後':'2Pe','彼得後書':'2Pe', '約一':'1Jn','約翰一書':'1Jn', '約二':'2Jn','約翰二書':'2Jn',
    '約三':'3Jn','約翰三書':'3Jn', '猶':'Jud','猶大書':'Jud', '啟':'Rev','啟示錄':'Rev'
  };

  // 排序書卷名，讓長的名稱優先匹配 (解決 "約翰一書" 被誤判為 "約" 的問題)
  const sortedBookNames = Object.keys(bookMap).sort((a, b) => b.length - a.length);

  let bibleData = [];
  let bibleReady = false;
  
  // 分頁相關全域變數
  let currentKeywordResults = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 100;
  let currentSearchKeywords = []; // 儲存當前搜尋的關鍵字以便高亮

  window.addEventListener('load', () => {
    const searchInput  = document.getElementById('searchInput');
    const keywordInput = document.getElementById('keywordInput');
    const keywordBtn   = document.getElementById('keywordBtn');
    
    // UI Loading 狀態
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<span style="color:#888">資料庫載入中，請稍候...</span>';

    searchInput.addEventListener('input', debounce(searchVerse, 300));
    keywordBtn.addEventListener('click', () => initKeywordSearch());
    keywordInput.addEventListener('keydown', e => { if (e.key === 'Enter') initKeywordSearch(); });

    loadCSVWithRetry();
  });

  async function loadCSVWithRetry(maxAttempts = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const bust = (attempt === 1) ? '' : `?v=${Date.now()}`;
        const opts = (attempt === 1) ? { cache: 'default' } : { cache: 'no-store' };
        
        const res = await fetch(`./bible.csv${bust}`, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, '');

        document.getElementById('result').innerHTML = '<span style="color:#666">資料下載完成，建立索引中...</span>';
        await parseCSVInWorker(text);

        bibleReady = true;
        document.getElementById('result').innerHTML = '';
        if (document.getElementById('searchInput').value.trim()) {
          searchVerse();
        }
        return;
      } catch (err) {
        lastErr = err;
        await delay(300 * attempt);
      }
    }
    document.getElementById('result').innerHTML = `<span style="color:red">資料載入失敗，請重新整理頁面。</span>`;
  }

  function parseCSVInWorker(csvText) {
    return new Promise((resolve, reject) => {
      const workerCode = `
        self.onmessage = (e) => {
          const data = e.data;
          const lines = data.split(/\\r?\\n/);
          const out = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i];
            if (!row) continue;
            const parts = row.split(',');
            if (parts.length >= 4) {
              out.push({
                book: parts[0].trim(),
                chapter: parts[1].trim(),
                verse: parts[2].trim(),
                text: parts.slice(3).join(',').trim()
              });
            }
          }
          postMessage(out);
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (ev) => {
        bibleData = ev.data || [];
        worker.terminate();
        resolve();
      };
      worker.postMessage(csvText);
    });
  }

  // === 工具: 中文數字轉阿拉伯數字 (僅處理 1-150 章節範圍通常夠用) ===
  function cnToNum(str) {
    if (!str) return null;
    // 如果已經是純數字，直接返回
    if (/^\d+$/.test(str)) return parseInt(str, 10);

    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '百':100 };
    let val = 0;
    
    // 簡單替換：將 "太六3" 的 "六" 換成 6
    // 但因為有 "十一" (11) 這種組合，我們需要一個簡單的解析邏輯
    // 這裡我們採用「替換法」：把中文數字單獨抓出來轉。
    // 針對聖經章節（通常小於 200），我們可以用簡單邏輯：
    
    // 特殊處理：如果不包含中文數字，返回 null
    if (!/[一二三四五六七八九十百]/.test(str)) return null;

    let num = 0;
    let temp = 0; 
    // 簡易解析器
    for (let i = 0; i < str.length; i++) {
      const char = str[i];
      const n = map[char];
      if (n === undefined) continue; // 跳過非數字字元

      if (n === 100) {
          num += (temp === 0 ? 1 : temp) * 100;
          temp = 0;
      } else if (n === 10) {
          num += (temp === 0 ? 1 : temp) * 10;
          temp = 0;
      } else {
          temp = n;
      }
    }
    num += temp;
    return num;
  }

  // === 核心: 解析搜尋字串 ===
  function parseSearchQuery(input) {
    // 移除所有空格
    input = input.replace(/\s+/g, '');
    
    // 1. 嘗試配對書卷名
    let bookKey = null;
    let remain = input;

    for (const key of sortedBookNames) {
      if (input.startsWith(key)) {
        bookKey = key;
        remain = input.substring(key.length);
        break;
      }
    }

    // 將剩餘字串中的分隔符號統一化 (將 : . ． 全換成 :)
    remain = remain.replace(/[.．]/g, ':');

    // 嘗試解析章節
    // 可能格式: "6:3", "六3", "6", "六"
    // 分割章和節
    let chapterStr = "";
    let verseStr = null;

    if (remain.includes(':')) {
      const parts = remain.split(':');
      chapterStr = parts[0];
      verseStr = parts[1];
    } else {
      // 沒有冒號，可能是 "六3" 或是純數字 "6"
      // 策略：找出數字與中文數字的邊界，或者如果全是中文/數字
      // 簡單做法：正則找出前段數字(含中文) 與 後段數字(含中文)
      // 例如 "六3" -> ch:六, v:3
      
      // 先把所有中文數字轉成阿拉伯數字字串，方便正則
      // 注意：不能直接轉，因為 "十二3" 會變成 123。
      // 我們假設：如果書卷後緊接數字，通常是章。
      // 如果混合了中文和阿拉伯數字 (太六3)，通常切分點在中文與阿拉伯數字變換處，或是如果全是中文 (太六三)，則比較模糊。
      // 但使用者需求是 "太六3" -> 6章3節。
      
      // 正則：(中文數字或阿拉伯數字串) 接著 (中文數字或阿拉伯數字串)?
      // 這比較難完美，我們採用使用者提到的具體格式：
      // 優先支援 "中文+阿拉伯" 或 "數字:數字"
      
      // 簡易 Parser: 
      // 1. 把所有中文數字字元標記起來
      const isDigit = (c) => /[0-9]/.test(c);
      const isCnDigit = (c) => /[一二三四五六七八九十百]/.test(c);
      
      let splitIndex = -1;
      // 尋找切分點：從數字類型改變的地方，或是明顯的邏輯
      // 如果只有一段連續的數字(不管中西)，那就是只有章
      
      // 針對 "六3" (CN -> Digit)
      for (let i = 0; i < remain.length - 1; i++) {
         if (isCnDigit(remain[i]) && isDigit(remain[i+1])) {
             splitIndex = i + 1;
             break;
         }
      }

      if (splitIndex !== -1) {
          chapterStr = remain.substring(0, splitIndex);
          verseStr = remain.substring(splitIndex);
      } else {
          // 如果沒有明顯切分，視為只有章 (例如 "太6" 或 "太六")
          chapterStr = remain;
      }
    }

    const chapter = cnToNum(chapterStr) || parseInt(chapterStr);
    const verse = verseStr ? (cnToNum(verseStr) || parseInt(verseStr)) : null;

    return {
      book: bookKey ? bookMap[bookKey] : null, // 英文簡寫
      chineseBook: bookKey,                    // 中文輸入
      chapter: chapter ? chapter.toString() : null,
      verse: verse ? verse.toString() : null
    };
  }

  // ====== 經文搜尋 (新邏輯) ======
  function searchVerse() {
    const input = document.getElementById('searchInput').value.trim();
    const resultElement = document.getElementById('result');

    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) return;

    // 解析輸入
    const query = parseSearchQuery(input);
    // console.log("Parsed Query:", query); // 除錯用

    let results = [];
    let title = "";

    // 情況 A: 有指定書卷 (例如: "太六3")
    if (query.book) {
       if (!query.chapter) {
           // 只有書卷名，不搜尋
           return;
       }
       results = bibleData.filter(e => 
         e.book === query.book && 
         e.chapter === query.chapter && 
         (query.verse === null || e.verse === query.verse)
       );
       
       // 顯示標題
       const cBookName = Object.keys(bookMap).find(k => bookMap[k] === query.book) || query.chineseBook;
       if (results.length > 0 && !query.verse) {
           title = `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">${cBookName} 第 ${query.chapter} 章</div>`;
       }
    } 
    // 情況 B: 沒書卷，但有章節 (例如: "6.3", "六3") -> 全經卷搜尋
    else if (query.chapter && query.verse) {
        results = bibleData.filter(e => 
            e.chapter === query.chapter && 
            e.verse === query.verse
        );
        if (results.length > 0) {
            title = `<div style="margin-bottom:10px; font-weight:bold; color:var(--primary-color)">全經卷搜尋：第 ${query.chapter} 章 第 ${query.verse} 節</div>`;
        }
    }

    if (results.length > 0) {
      let htmlBuffer = title;
      results.forEach(e => {
        const cBook = Object.keys(bookMap).find(k => bookMap[k] === e.book) || e.book;
        htmlBuffer += `
          <div class="result-item">
            <div>
              <span class="verse-ref">${cBook} ${e.chapter}:${e.verse}</span>
              <span class="verse-text">${e.text}</span>
            </div>
            <div class="action-bar">
               <button class="copy-btn" onclick='copyToClipboard("${cBook} ${e.chapter}:${e.verse} ${e.text}")'>
                 複製
               </button>
            </div>
          </div>
        `;
      });
      resultElement.innerHTML = htmlBuffer;
    } else {
      // 只有在輸入看起來像經文格式時才顯示「查無經文」
      if (query.chapter) {
          resultElement.innerHTML = '<div style="color:#999">查無經文，請確認格式 (如: 太6:3 或 6:3)。</div>';
      }
    }
  }

  // ====== 關鍵字搜尋 (分頁版) ======
  function initKeywordSearch() {
    const input = document.getElementById('keywordInput').value.trim();
    if (!bibleReady) return;
    if (!input) { showToast('請輸入關鍵字'); return; }

    const keywords = input.split(' ').filter(Boolean);
    currentSearchKeywords = keywords;
    
    // 搜尋所有符合的資料
    currentKeywordResults = [];
    for (const entry of bibleData) {
      if (keywords.every(k => entry.text.includes(k))) {
        currentKeywordResults.push(entry);
      }
    }

    if (currentKeywordResults.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="padding:20px; text-align:center; color:#999">找不到相關經文。</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }

    // 重置分頁並渲染第一頁
    currentPage = 1;
    renderKeywordPage();
  }

  function renderKeywordPage() {
      const container = document.getElementById('keywordResult');
      const paginationDiv = document.getElementById('paginationContainer');
      const totalItems = currentKeywordResults.length;
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

      // 計算當前頁面的資料範圍
      const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalItems);
      const pageData = currentKeywordResults.slice(startIdx, endIdx);

      // Regex 準備
      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${currentSearchKeywords.map(esc).join('|')})`, 'gi');

      let htmlBuffer = `<div style="padding:10px 0; color:#666;">共找到 ${totalItems} 筆資料 (第 ${currentPage} / ${totalPages} 頁)</div>`;

      pageData.forEach(entry => {
        const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
        const cBook = Object.keys(bookMap).find(k => bookMap[k] === entry.book) || entry.book;
        const fullRef = `${cBook} ${entry.chapter}:${entry.verse}`;

        htmlBuffer += `
          <div class="result-item">
            <div class="verse-ref">${fullRef}</div>
            <div class="verse-text">${highlightedText}</div>
             <div class="action-bar">
               <button class="copy-btn" onclick='copyToClipboard("${fullRef} ${entry.text}")'>
                 複製
               </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlBuffer;
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 渲染分頁按鈕
      if (totalPages > 1) {
          paginationDiv.style.display = 'flex';
          paginationDiv.innerHTML = `
              <button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>上一頁</button>
              <span style="font-size:0.9rem; color:#666;">${currentPage} / ${totalPages}</span>
              <button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>下一頁</button>
          `;
      } else {
          paginationDiv.style.display = 'none';
      }
  }

  function changePage(delta) {
      const totalPages = Math.ceil(currentKeywordResults.length / ITEMS_PER_PAGE);
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= totalPages) {
          currentPage = newPage;
          renderKeywordPage();
      }
  }
  
  // 為了讓 HTML onclick 能呼叫到 changePage，需確保它在 window scope (這段腳本在 HTML 內，預設就是 global)
  window.changePage = changePage;

  // ====== 工具函式 ======
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast('經文已複製'));
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = 0;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('經文已複製');
      } catch (err) {
        showToast('複製失敗');
      }
      document.body.removeChild(textarea);
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show';
    setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
  }

  function debounce(fn, wait = 200) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
  }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
