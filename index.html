<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ 咻咻查聖經 ✦</title>
  <link rel="icon" href="data:,">
  <style>
    /* === 1. 基礎設定 & 變數 === */
    :root {
      --primary-color: #5d4037; /* 深棕色，適合閱讀 */
      --accent-color: #8d6e63;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --highlight-color: #fff9c4;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    /* === 2. 佈局容器 === */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* === 3. 卡片式設計 === */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* === 4. 輸入框與按鈕 === */
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px; /* 防止 iOS 自動縮放 */
      transition: border-color 0.3s;
      width: 100%;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    button:hover {
      background-color: #4e342e;
    }

    /* === 5. 搜尋結果列表 === */
    .result-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item:last-child { border-bottom: none; }

    .verse-ref {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.95rem;
    }

    .verse-text {
      font-size: 1.05rem;
      text-align: justify;
    }

    .highlight { 
      background-color: var(--highlight-color); 
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* === 6. 複製按鈕優化 === */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .copy-btn {
      background-color: transparent;
      color: #777;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
    }

    .copy-btn:hover {
      background-color: #f0f0f0;
      color: #333;
    }

    /* === 7. Toast 提示 === */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 12px;
      position: fixed;
      z-index: 99;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
    
    /* === 響應式調整 === */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .card { padding: 15px; }
      h1 { font-size: 1.5rem; }
      
      /* 讓搜尋按鈕在手機上佔滿寬度，方便點擊 */
      #keywordBtn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✦ 咻咻查聖經 ✦</h1>
  <p class="subtitle">快速經文檢索・即時關鍵字搜尋</p>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">經文查詢</label>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="範例：太6:33、詩23 (支援多種格式)">
    </div>
    <div id="result" style="margin-top: 15px;"></div>
  </div>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">關鍵字查詢</label>
    <div class="search-group">
      <input type="text" id="keywordInput" placeholder="輸入關鍵字 (空格分隔多個詞)">
      <button id="keywordBtn">搜尋</button>
    </div>
    <div id="keywordResult" style="margin-top: 15px;"></div>
  </div>
</div>

<div id="toast" class="toast">已複製經文</div>

<script>
  // === 卷名對照 (維持不變) ===
  const bookMap = {
    '創':'Gen','創世記':'Gen', '出':'Exo','出埃及記':'Exo', '利':'Lev','利未記':'Lev',
    '民':'Num','民數記':'Num', '申':'Deu','申命記':'Deu', '書':'Jos','約書亞記':'Jos',
    '士':'Jug','士師記':'Jug', '得':'Rut','路得記':'Rut', '撒上':'1Sa','撒母耳記上':'1Sa',
    '撒下':'2Sa','撒母耳記下':'2Sa', '王上':'1Ki','列王記上':'1Ki', '王下':'2Ki','列王記下':'2Ki',
    '代上':'1Ch','歷代志上':'1Ch', '代下':'2Ch','歷代志下':'2Ch', '拉':'Ezr','以斯拉記':'Ezr',
    '尼':'Neh','尼希米記':'Neh', '斯':'Est','以斯帖記':'Est', '伯':'Job','約伯記':'Job',
    '詩':'Psm','詩篇':'Psm', '箴':'Pro','箴言':'Pro', '傳':'Ecc','傳道書':'Ecc',
    '歌':'Son','雅歌':'Son', '賽':'Isa','以賽亞書':'Isa', '耶':'Jer','耶利米書':'Jer',
    '哀':'Lam','耶利米哀歌':'Lam', '結':'Eze','以西結書':'Eze', '但':'Dan','但以理書':'Dan',
    '何':'Hos','何西阿書':'Hos', '珥':'Joe','約珥書':'Joe', '摩':'Amo','阿摩司書':'Amo',
    '俄':'Oba','俄巴底亞書':'Oba', '拿':'Jon','約拿書':'Jon', '彌':'Mic','彌迦書':'Mic',
    '鴻':'Nah','那鴻書':'Nah', '哈':'Hab','哈巴谷書':'Hab', '番':'Zep','西番雅書':'Zep',
    '該':'Hag','哈該書':'Hag', '亞':'Zec','撒迦利亞書':'Zec', '瑪':'Mal','瑪拉基書':'Mal',
    '太':'Mat','馬太福音':'Mat', '可':'Mak','馬可福音':'Mak', '路':'Luk','路加福音':'Luk',
    '約':'Jhn','約翰福音':'Jhn', '徒':'Act','使徒行傳':'Act', '羅':'Rom','羅馬書':'Rom',
    '林前':'1Co','哥林多前書':'1Co', '林後':'2Co','哥林多後書':'2Co', '加':'Gal','加拉太書':'Gal',
    '弗':'Eph','以弗所書':'Eph', '腓':'Phl','腓立比書':'Phl', '西':'Col','歌羅西書':'Col',
    '帖前':'1Ts','帖撒羅尼迦前書':'1Ts', '帖後':'2Ts','帖撒羅尼迦後書':'2Ts', '提前':'1Ti','提摩太前書':'1Ti',
    '提後':'2Ti','提摩太後書':'2Ti', '多':'Tit','提多書':'Tit', '門':'Phm','腓利門書':'Phm',
    '來':'Heb','希伯來書':'Heb', '雅':'Jas','雅各書':'Jas', '彼前':'1Pe','彼得前書':'1Pe',
    '彼後':'2Pe','彼得後書':'2Pe', '約一':'1Jn','約翰一書':'1Jn', '約二':'2Jn','約翰二書':'2Jn',
    '約三':'3Jn','約翰三書':'3Jn', '猶':'Jud','猶大書':'Jud', '啟':'Rev','啟示錄':'Rev'
  };

  let bibleData = [];
  let bibleReady = false;
  let loadingError = null;

  window.addEventListener('load', () => {
    const searchInput  = document.getElementById('searchInput');
    const keywordInput = document.getElementById('keywordInput');
    const keywordBtn   = document.getElementById('keywordBtn');
    
    // UI Loading 狀態
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<span style="color:#888">資料庫載入中，請稍候...</span>';

    searchInput.addEventListener('input', debounce(searchVerse, 200));
    keywordBtn.addEventListener('click', searchKeyword);
    keywordInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchKeyword(); });

    loadCSVWithRetry();
  });

  async function loadCSVWithRetry(maxAttempts = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const bust = (attempt === 1) ? '' : `?v=${Date.now()}`;
        const opts = (attempt === 1) ? { cache: 'default' } : { cache: 'no-store' };
        
        const res = await fetch(`./bible.csv${bust}`, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, '');

        document.getElementById('result').innerHTML = '<span style="color:#666">資料下載完成，建立索引中...</span>';
        await parseCSVInWorker(text);

        bibleReady = true;
        loadingError = null;
        
        // 載入完成清空提示
        document.getElementById('result').innerHTML = '';
        
        if (document.getElementById('searchInput').value.trim()) {
          searchVerse();
        }
        return;
      } catch (err) {
        lastErr = err;
        await delay(300 * attempt);
      }
    }
    bibleReady = false;
    loadingError = lastErr?.message || '載入失敗';
    document.getElementById('result').innerHTML = `<span style="color:red">資料載入失敗，請重新整理頁面。</span>`;
  }

  function parseCSVInWorker(csvText) {
    return new Promise((resolve, reject) => {
      const workerCode = `
        self.onmessage = (e) => {
          const data = e.data;
          const lines = data.split(/\\r?\\n/);
          const out = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i];
            if (!row) continue;
            const parts = row.split(',');
            if (parts.length >= 4) {
              out.push({
                book: parts[0].trim(),
                chapter: parts[1].trim(),
                verse: parts[2].trim(),
                text: parts.slice(3).join(',').trim()
              });
            }
          }
          postMessage(out);
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (ev) => {
        bibleData = ev.data || [];
        worker.terminate();
        resolve();
      };
      worker.onerror = (err) => {
        worker.terminate();
        reject(err);
      };
      worker.postMessage(csvText);
    });
  }

  // ====== 經文搜尋 (UI 優化版) ======
  function searchVerse() {
    const input = document.getElementById('searchInput').value.trim();
    const resultElement = document.getElementById('result');

    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) return;
    if (input.includes(' ')) { 
      resultElement.innerHTML = '<div style="color:orange">格式提示：不需要空格，請直接輸入如「太2:1」</div>'; 
      return; 
    }

    const regex = /^(\D{1,4})(\d+)[章:.．]?(\d+)?$/;
    const match = input.match(regex);
    if (!match) { 
        // 不顯示錯誤，保持安靜，除非格式明顯錯誤
        return; 
    }

    const chineseBook = match[1].trim();
    const chapter = match[2].trim();
    const verse = match[3] ? match[3].trim() : null;
    const englishBook = bookMap[chineseBook];

    if (!englishBook) { resultElement.innerHTML = '<div style="color:#999">查無此書卷，請確認簡稱。</div>'; return; }

    let htmlBuffer = '';
    
    // 查詢邏輯
    const results = bibleData.filter(e => 
      e.book === englishBook && 
      e.chapter === chapter && 
      (verse === null || e.verse === verse)
    );

    if (results.length > 0) {
      // 整章顯示時，加上標題
      if (verse === null) {
        htmlBuffer += `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">${chineseBook} 第 ${chapter} 章</div>`;
      }

      results.forEach(e => {
        htmlBuffer += `
          <div class="result-item">
            <div>
              <span class="verse-ref">${e.chapter}:${e.verse}</span>
              <span class="verse-text">${e.text}</span>
            </div>
            <div class="action-bar">
               <button class="copy-btn" onclick='copyToClipboard("${chineseBook} ${e.chapter}:${e.verse} ${e.text}")'>
                 複製
               </button>
            </div>
          </div>
        `;
      });
      resultElement.innerHTML = htmlBuffer;
    } else {
      resultElement.innerHTML = '<div style="color:#999">查無經文。</div>';
    }
  }

  // ====== 關鍵字搜尋 (UI 優化版) ======
  function searchKeyword() {
    const input = document.getElementById('keywordInput').value.trim();
    const resultElement = document.getElementById('keywordResult');

    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) { showToast('請輸入關鍵字'); return; }

    const keywords = input.split(' ').filter(Boolean);
    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${keywords.map(esc).join('|')})`, 'gi');

    let htmlBuffer = '';
    let count = 0;
    // 限制顯示筆數以防當機
    const MAX_RESULTS = 100; 

    for (const entry of bibleData) {
      if (keywords.every(k => entry.text.includes(k))) {
        count++;
        if (count > MAX_RESULTS) continue; // 超過不渲染，但繼續計數

        const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
        const chineseBook = Object.keys(bookMap).find(k => bookMap[k] === entry.book) || entry.book;
        const fullRef = `${chineseBook} ${entry.chapter}:${entry.verse}`;

        htmlBuffer += `
          <div class="result-item">
            <div class="verse-ref">${fullRef}</div>
            <div class="verse-text">${highlightedText}</div>
             <div class="action-bar">
               <button class="copy-btn" onclick='copyToClipboard("${fullRef} ${entry.text}")'>
                 複製
               </button>
            </div>
          </div>
        `;
      }
    }

    if (count > 0) {
      let header = `<div style="padding:10px 0; color:#666;">共找到 ${count} 筆資料`;
      if (count > MAX_RESULTS) header += ` (僅顯示前 ${MAX_RESULTS} 筆)`;
      header += `</div>`;
      resultElement.innerHTML = header + htmlBuffer;
    } else {
      resultElement.innerHTML = '<div style="padding:20px; text-align:center; color:#999">找不到相關經文。</div>';
    }
  }

  // ====== 工具函式 ======
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast('經文已複製'));
    } else {
      // Fallback
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = 0;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('經文已複製');
      } catch (err) {
        showToast('複製失敗');
      }
      document.body.removeChild(textarea);
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show';
    setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
  }

  function debounce(fn, wait = 200) {
    let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
  }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
