<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ 咻咻查聖經 ✦</title>
  <link rel="icon" href="data:,">
  <style>
    /* === 1. 基礎設定 & 變數 === */
    :root {
      --primary-color: #5d4037;
      --accent-color: #8d6e63;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --highlight-color: #fff9c4; /* 搜尋高亮色 */
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    /* === 2. 佈局容器 === */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* === 3. 卡片式設計 === */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* === 4. 輸入框與按鈕 === */
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      width: 100%;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    button:hover {
      background-color: #4e342e;
    }
    
    /* === 5. 分頁跳轉樣式 (新功能) === */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
        align-items: center;
        background: #fafafa;
        padding: 10px;
        border-radius: 8px;
    }
    
    .page-input {
        width: 60px;
        padding: 8px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
    }

    .page-label {
        color: #666;
        font-size: 0.95rem;
    }

    .jump-btn {
        padding: 8px 15px;
        background-color: var(--accent-color);
        font-size: 14px;
    }

    /* === 6. 搜尋結果列表 === */
    .result-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-item:last-child { border-bottom: none; }

    .verse-ref {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.95rem;
    }

    .verse-text {
      font-size: 1.05rem;
      text-align: justify;
    }

    .highlight { 
      background-color: var(--highlight-color); 
      padding: 2px 4px;
      border-radius: 4px;
      color: #000;
    }

    /* === 7. 複製按鈕 === */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .copy-btn {
      background-color: transparent;
      color: #777;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
    }

    .copy-btn:hover {
      background-color: #f0f0f0;
      color: #333;
    }

    /* === 8. Toast 提示 === */
    .toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 12px;
      position: fixed;
      z-index: 99;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
    
    /* === 響應式調整 === */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .card { padding: 15px; }
      h1 { font-size: 1.5rem; }
      #keywordBtn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✦ 咻咻查聖經 3.1 ✦</h1>
  <p class="subtitle">支援：太六3、1.7 (全經卷)、關鍵字排除 (-神)</p>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">經文查詢</label>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="範例：太六3、6:3、1.7、詩23">
    </div>
    <div id="result" style="margin-top: 15px;"></div>
  </div>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">關鍵字查詢</label>
    <div class="search-group">
      <input type="text" id="keywordInput" placeholder="範例：我 -神 (找有我但沒神的)">
      <button id="keywordBtn">搜尋</button>
    </div>
    
    <div id="keywordResult" style="margin-top: 15px;"></div>
    
    <div id="paginationContainer" class="pagination" style="display:none;">
        <span class="page-label">第</span>
        <input type="number" id="pageInput" class="page-input" value="1" min="1">
        <span class="page-label"> / <span id="totalPagesDisplay">1</span> 頁</span>
        <button class="jump-btn" onclick="jumpToPage()">GO</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">已複製經文</div>

<script>
  // === 卷名對照 (資料庫) ===
  const bookMap = {
    '創':'Gen','創世記':'Gen', '出':'Exo','出埃及記':'Exo', '利':'Lev','利未記':'Lev',
    '民':'Num','民數記':'Num', '申':'Deu','申命記':'Deu', '書':'Jos','約書亞記':'Jos',
    '士':'Jug','士師記':'Jug', '得':'Rut','路得記':'Rut', '撒上':'1Sa','撒母耳記上':'1Sa',
    '撒下':'2Sa','撒母耳記下':'2Sa', '王上':'1Ki','列王記上':'1Ki', '王下':'2Ki','列王記下':'2Ki',
    '代上':'1Ch','歷代志上':'1Ch', '代下':'2Ch','歷代志下':'2Ch', '拉':'Ezr','以斯拉記':'Ezr',
    '尼':'Neh','尼希米記':'Neh', '斯':'Est','以斯帖記':'Est', '伯':'Job','約伯記':'Job',
    '詩':'Psm','詩篇':'Psm', '箴':'Pro','箴言':'Pro', '傳':'Ecc','傳道書':'Ecc',
    '歌':'Son','雅歌':'Son', '賽':'Isa','以賽亞書':'Isa', '耶':'Jer','耶利米書':'Jer',
    '哀':'Lam','耶利米哀歌':'Lam', '結':'Eze','以西結書':'Eze', '但':'Dan','但以理書':'Dan',
    '何':'Hos','何西阿書':'Hos', '珥':'Joe','約珥書':'Joe', '摩':'Amo','阿摩司書':'Amo',
    '俄':'Oba','俄巴底亞書':'Oba', '拿':'Jon','約拿書':'Jon', '彌':'Mic','彌迦書':'Mic',
    '鴻':'Nah','那鴻書':'Nah', '哈':'Hab','哈巴谷書':'Hab', '番':'Zep','西番雅書':'Zep',
    '該':'Hag','哈該書':'Hag', '亞':'Zec','撒迦利亞書':'Zec', '瑪':'Mal','瑪拉基書':'Mal',
    '太':'Mat','馬太福音':'Mat', '可':'Mak','馬可福音':'Mak', '路':'Luk','路加福音':'Luk',
    '約':'Jhn','約翰福音':'Jhn', '徒':'Act','使徒行傳':'Act', '羅':'Rom','羅馬書':'Rom',
    '林前':'1Co','哥林多前書':'1Co', '林後':'2Co','哥林多後書':'2Co', '加':'Gal','加拉太書':'Gal',
    '弗':'Eph','以弗所書':'Eph', '腓':'Phl','腓立比書':'Phl', '西':'Col','歌羅西書':'Col',
    '帖前':'1Ts','帖撒羅尼迦前書':'1Ts', '帖後':'2Ts','帖撒羅尼迦後書':'2Ts', '提前':'1Ti','提摩太前書':'1Ti',
    '提後':'2Ti','提摩太後書':'2Ti', '多':'Tit','提多書':'Tit', '門':'Phm','腓利門書':'Phm',
    '來':'Heb','希伯來書':'Heb', '雅':'Jas','雅各書':'Jas', '彼前':'1Pe','彼得前書':'1Pe',
    '彼後':'2Pe','彼得後書':'2Pe', '約一':'1Jn','約翰一書':'1Jn', '約二':'2Jn','約翰二書':'2Jn',
    '約三':'3Jn','約翰三書':'3Jn', '猶':'Jud','猶大書':'Jud', '啟':'Rev','啟示錄':'Rev'
  };

  // 預先排序，避免 "約翰一書" 被誤判為 "約"
  const sortedBookNames = Object.keys(bookMap).sort((a, b) => b.length - a.length);

  let bibleData = [];
  let bibleReady = false;
  
  // 分頁與搜尋狀態
  let currentKeywordResults = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 100;
  let currentIncludeKeywords = []; // 用於高亮

  window.addEventListener('load', () => {
    const searchInput  = document.getElementById('searchInput');
    const keywordInput = document.getElementById('keywordInput');
    const keywordBtn   = document.getElementById('keywordBtn');
    
    // 初始化 UI 
    document.getElementById('result').innerHTML = '<span style="color:#888">資料庫載入中，請稍候...</span>';

    // 綁定事件
    searchInput.addEventListener('input', debounce(searchVerse, 300));
    keywordBtn.addEventListener('click', () => initKeywordSearch());
    keywordInput.addEventListener('keydown', e => { if (e.key === 'Enter') initKeywordSearch(); });
    
    // 分頁輸入框 Enter
    document.getElementById('pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') jumpToPage(); });

    // 開始載入資料
    loadCSVWithRetry();
  });

  // === 1. 資料載入 (Fetch + Worker) ===
  async function loadCSVWithRetry(maxAttempts = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const bust = (attempt === 1) ? '' : `?v=${Date.now()}`;
        const opts = (attempt === 1) ? { cache: 'default' } : { cache: 'no-store' };
        
        const res = await fetch(`./bible.csv${bust}`, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, ''); // 移除 BOM

        document.getElementById('result').innerHTML = '<span style="color:#666">資料處理中...</span>';
        await parseCSVInWorker(text);

        bibleReady = true;
        document.getElementById('result').innerHTML = '';
        if (document.getElementById('searchInput').value.trim()) searchVerse();
        return;
      } catch (err) {
        lastErr = err;
        await delay(300 * attempt);
      }
    }
    document.getElementById('result').innerHTML = `<span style="color:red">資料載入失敗，請確認 bible.csv 存在。</span>`;
  }

  function parseCSVInWorker(csvText) {
    return new Promise((resolve, reject) => {
      const workerCode = `
        self.onmessage = (e) => {
          const lines = e.data.split(/\\r?\\n/);
          const out = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i];
            if (!row) continue;
            const parts = row.split(',');
            if (parts.length >= 4) {
              out.push({
                book: parts[0].trim(),
                chapter: parts[1].trim(),
                verse: parts[2].trim(),
                text: parts.slice(3).join(',').trim()
              });
            }
          }
          postMessage(out);
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (ev) => {
        bibleData = ev.data || [];
        worker.terminate();
        resolve();
      };
      worker.postMessage(csvText);
    });
  }

  // === 2. 工具函式：中文轉數字 ===
  function cnToNum(str) {
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '百':100 };
    if (!/[一二三四五六七八九十百]/.test(str)) return null;
    let num = 0, temp = 0; 
    for (let i = 0; i < str.length; i++) {
      const n = map[str[i]];
      if (n === undefined) continue;
      if (n === 100) { num += (temp === 0 ? 1 : temp) * 100; temp = 0; }
      else if (n === 10) { num += (temp === 0 ? 1 : temp) * 10; temp = 0; }
      else { temp = n; }
    }
    num += temp;
    return num;
  }

  // === 3. 核心：解析經文搜尋字串 (強化符號支援) ===
  function parseSearchQuery(input) {
    input = input.replace(/\s+/g, ''); // 移除所有空格
    
    let bookKey = null;
    let remain = input;

    // 3-1. 找書卷名
    for (const key of sortedBookNames) {
      if (input.startsWith(key)) {
        bookKey = key;
        remain = input.substring(key.length);
        break;
      }
    }

    // 3-2. 符號標準化：小數點、句號、逗號 -> 冒號
    remain = remain.replace(/[.．。,，]/g, ':');

    let chapterStr = "";
    let verseStr = null;

    if (remain.includes(':')) {
      const parts = remain.split(':');
      chapterStr = parts[0];
      verseStr = parts[1];
    } else {
      // 處理 "太六3" 這種無冒號情況
      const isDigit = (c) => /[0-9]/.test(c);
      const isCnDigit = (c) => /[一二三四五六七八九十百]/.test(c);
      
      let splitIndex = -1;
      // 找中西數字交界
      for (let i = 0; i < remain.length - 1; i++) {
         if (isCnDigit(remain[i]) && isDigit(remain[i+1])) {
             splitIndex = i + 1;
             break;
         }
      }

      if (splitIndex !== -1) {
          chapterStr = remain.substring(0, splitIndex);
          verseStr = remain.substring(splitIndex);
      } else {
          chapterStr = remain;
      }
    }

    const chapter = cnToNum(chapterStr) || parseInt(chapterStr);
    const verse = verseStr ? (cnToNum(verseStr) || parseInt(verseStr)) : null;

    return { 
        book: bookKey ? bookMap[bookKey] : null, 
        chineseBook: bookKey, 
        chapter: chapter ? chapter.toString() : null, 
        verse: verse ? verse.toString() : null 
    };
  }

  // === 4. 經文搜尋邏輯 ===
  function searchVerse() {
    const input = document.getElementById('searchInput').value.trim();
    const resultElement = document.getElementById('result');
    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) return;

    const query = parseSearchQuery(input);
    let results = [];
    let title = "";

    // A. 指定書卷搜尋 (太6:3)
    if (query.book) {
       if (!query.chapter) return;
       results = bibleData.filter(e => e.book === query.book && e.chapter === query.chapter && (query.verse === null || e.verse === query.verse));
       const cBookName = Object.keys(bookMap).find(k => bookMap[k] === query.book) || query.chineseBook;
       if (results.length > 0 && !query.verse) title = `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">${cBookName} 第 ${query.chapter} 章</div>`;
    } 
    // B. 全經卷搜尋 (6:3)
    else if (query.chapter && query.verse) {
        results = bibleData.filter(e => e.chapter === query.chapter && e.verse === query.verse);
        if (results.length > 0) title = `<div style="margin-bottom:10px; font-weight:bold; color:var(--primary-color)">全經卷搜尋：第 ${query.chapter} 章 第 ${query.verse} 節</div>`;
    }

    if (results.length > 0) {
      let htmlBuffer = title;
      results.forEach(e => {
        const cBook = Object.keys(bookMap).find(k => bookMap[k] === e.book) || e.book;
        htmlBuffer += `<div class="result-item"><div><span class="verse-ref">${cBook} ${e.chapter}:${e.verse}</span> <span class="verse-text">${e.text}</span></div><div class="action-bar"><button class="copy-btn" onclick='copyToClipboard("${cBook} ${e.chapter}:${e.verse} ${e.text}")'>複製</button></div></div>`;
      });
      resultElement.innerHTML = htmlBuffer;
    } else {
      if (query.chapter) resultElement.innerHTML = '<div style="color:#999">查無經文。</div>';
    }
  }

  // === 5. 關鍵字搜尋 (包含與排除) ===
  function initKeywordSearch() {
    const input = document.getElementById('keywordInput').value.trim();
    if (!bibleReady) return;
    if (!input) { showToast('請輸入關鍵字'); return; }

    // 解析關鍵字
    const rawTokens = input.split(' ').filter(t => t.trim() !== '');
    const includes = [];
    const excludes = [];

    rawTokens.forEach(token => {
      if (token.startsWith('-') && token.length > 1) {
        excludes.push(token.substring(1)); // 移除減號
      } else {
        includes.push(token);
      }
    });
    
    currentIncludeKeywords = includes;

    // 必須至少有一個包含關鍵字，否則資料量太大或無意義
    if (includes.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="color:red; text-align:center;">請至少輸入一個正向關鍵字 (例如: 我 -神)</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }

    // 篩選資料
    currentKeywordResults = [];
    for (const entry of bibleData) {
      // AND 邏輯：必須包含所有正向詞
      const hasAllIncludes = includes.every(key => entry.text.includes(key));
      if (!hasAllIncludes) continue;

      // NOT 邏輯：不能包含任何反向詞
      const hasAnyExclude = excludes.some(key => entry.text.includes(key));
      if (hasAnyExclude) continue;

      currentKeywordResults.push(entry);
    }

    if (currentKeywordResults.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="padding:20px; text-align:center; color:#999">找不到相關經文。</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }

    // 重置分頁
    currentPage = 1;
    document.getElementById('pageInput').value = 1; 
    renderKeywordPage();
  }

  // === 6. 分頁渲染 ===
  function renderKeywordPage() {
      const container = document.getElementById('keywordResult');
      const paginationDiv = document.getElementById('paginationContainer');
      const totalItems = currentKeywordResults.length;
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

      const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalItems);
      const pageData = currentKeywordResults.slice(startIdx, endIdx);

      // 高亮 Regex
      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${currentIncludeKeywords.map(esc).join('|')})`, 'gi');

      let htmlBuffer = `<div style="padding:10px 0; color:#666;">共找到 ${totalItems} 筆資料</div>`;

      pageData.forEach(entry => {
        const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
        const cBook = Object.keys(bookMap).find(k => bookMap[k] === entry.book) || entry.book;
        const fullRef = `${cBook} ${entry.chapter}:${entry.verse}`;

        htmlBuffer += `
          <div class="result-item">
            <div class="verse-ref">${fullRef}</div>
            <div class="verse-text">${highlightedText}</div>
             <div class="action-bar">
               <button class="copy-btn" onclick='copyToClipboard("${fullRef} ${entry.text}")'>複製</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlBuffer;
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 更新分頁 UI
      if (totalPages > 1) {
          paginationDiv.style.display = 'flex';
          document.getElementById('totalPagesDisplay').textContent = totalPages;
          document.getElementById('pageInput').max = totalPages;
      } else {
          paginationDiv.style.display = 'none';
      }
  }

  // === 7. 跳頁邏輯 ===
  function jumpToPage() {
      const input = document.getElementById('pageInput');
      const totalPages = Math.ceil(currentKeywordResults.length / ITEMS_PER_PAGE);
      let val = parseInt(input.value);

      if (isNaN(val) || val < 1) val = 1;
      if (val > totalPages) val = totalPages;

      currentPage = val;
      input.value = val; 
      renderKeywordPage();
  }

  // === 8. 其他工具 ===
  window.jumpToPage = jumpToPage;
  window.copyToClipboard = copyToClipboard;

  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast('經文已複製'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = 0;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('經文已複製'); } catch (e) { showToast('複製失敗'); }
      document.body.removeChild(ta);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show';
    setTimeout(() => { t.className = t.className.replace('show', ''); }, 3000);
  }
  function debounce(fn, w = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), w); }; }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
