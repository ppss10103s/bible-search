<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ 咻咻查聖經 3.8 ✦</title>
  <link rel="icon" href="data:,">
  <style>
    /* === 1. 基礎設定 & 變數 === */
    :root {
      --primary-color: #5d4037;
      --accent-color: #8d6e63;
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --highlight-color: #fff9c4;
      --selected-bg: #ffe0b2;
      --shadow: 0 4px 6px rgba(0,0,0,0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
      padding-bottom: 120px;
    }

    /* === 2. 佈局容器 === */
    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    /* === 3. 卡片式設計 === */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* === 4. 輸入框與按鈕 === */
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
    }
    input[type="text"]:focus { outline: none; border-color: var(--primary-color); }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background-color: #4e342e; }
    
    /* === 5. 分頁區塊 === */
    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
        align-items: center;
        background: #fafafa;
        padding: 10px;
        border-radius: 8px;
    }
    
    .page-input {
        width: 60px;
        padding: 8px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
    }
    .jump-btn {
        padding: 8px 15px;
        background-color: var(--accent-color);
        font-size: 14px;
    }

    /* === 6. 搜尋結果列表 === */
    .result-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      border-radius: 8px;
    }
    
    .result-item:last-child { border-bottom: none; }

    /* 選取狀態 */
    .result-item.selected {
        background-color: var(--selected-bg);
        border-color: transparent;
    }

    .verse-ref {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1rem;
    }

    .verse-text {
      font-size: 1.05rem;
      text-align: justify;
    }

    .highlight { 
      background-color: var(--highlight-color); 
      padding: 2px 4px;
      border-radius: 4px;
      color: #000;
    }

    /* 單節複製按鈕 */
    .action-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .copy-btn {
      background-color: transparent;
      color: #777;
      border: 1px solid #ddd;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
      z-index: 2;
    }

    .copy-btn:hover {
      background-color: #f0f0f0;
      color: #333;
      border-color: #999;
    }

    /* === 7. 浮動批次複製按鈕 (FAB) === */
    .fab-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(150px);
        background-color: #333;
        color: white;
        padding: 12px 20px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        gap: 15px;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        z-index: 100;
        min-width: 280px;
        justify-content: space-between;
    }

    .fab-container.show {
        transform: translateX(-50%) translateY(0);
    }

    .fab-text { font-size: 0.95rem; font-weight: bold; }
    
    .fab-btn {
        background-color: var(--selected-bg);
        color: #5d4037;
        border: none;
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .fab-btn:active { transform: scale(0.95); }

    .fab-close {
        background: none;
        border: none;
        color: #aaa;
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0 5px;
    }
    .fab-close:hover { color: #fff; }

    /* === Toast 提示 === */
    .toast {
      visibility: hidden;
      min-width: 200px;
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      text-align: center;
      border-radius: 8px;
      padding: 10px;
      position: fixed;
      z-index: 101;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { visibility: visible; opacity: 1; }

    /* RWD */
    @media (max-width: 600px) {
      body { padding: 10px; padding-bottom: 120px; }
      .card { padding: 15px; }
      h1 { font-size: 1.5rem; }
      #keywordBtn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✦ 咻咻查聖經 3.8 ✦</h1>
  <p class="subtitle">快速檢索・支援多種簡稱・可批次選取複製</p>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">經文查詢</label>
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="輸入範例：太6:33、馬太五、腓立比書4">
    </div>
    <div id="result" style="margin-top: 15px;"></div>
  </div>

  <div class="card">
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary-color);">關鍵字查詢</label>
    <div class="search-group">
      <input type="text" id="keywordInput" placeholder="關鍵字空格分隔，減號可排除 (如：光 -暗)">
      <button id="keywordBtn">搜尋</button>
    </div>
    
    <div id="keywordResult" style="margin-top: 15px;"></div>
    
    <div id="paginationContainer" class="pagination" style="display:none;">
        <span class="page-label">第</span>
        <input type="number" id="pageInput" class="page-input" value="1" min="1">
        <span class="page-label"> / <span id="totalPagesDisplay">1</span> 頁</span>
        <button class="jump-btn" onclick="jumpToPage()">GO</button>
    </div>
  </div>
</div>

<div id="fab" class="fab-container">
    <div style="display:flex; align-items:center; gap:10px;">
        <button class="fab-close" onclick="clearSelection()" title="清除所有選取">✕</button>
        <span class="fab-text" id="fabText">已選 0 節</span>
    </div>
    <button class="fab-btn" onclick="copySelectedVerses()">複製全部</button>
</div>

<div id="toast" class="toast">已複製</div>

<script>
  // === 1. 資料庫對照表 (完整支援) ===
  const bookMap = {
    // 舊約
    '創':'Gen','創世':'Gen','創世記':'Gen', 
    '出':'Exo','出埃及':'Exo','出埃及記':'Exo', 
    '利':'Lev','利未':'Lev','利未記':'Lev',
    '民':'Num','民數':'Num','民數記':'Num', 
    '申':'Deu','申命':'Deu','申命記':'Deu', 
    '書':'Jos','約書亞':'Jos','約書亞記':'Jos',
    '士':'Jug','士師':'Jug','士師記':'Jug', 
    '得':'Rut','路得':'Rut','路得記':'Rut', 
    '撒上':'1Sa','撒母耳上':'1Sa','撒母耳記上':'1Sa',
    '撒下':'2Sa','撒母耳下':'2Sa','撒母耳記下':'2Sa', 
    '王上':'1Ki','列王上':'1Ki','列王記上':'1Ki', 
    '王下':'2Ki','列王下':'2Ki','列王記下':'2Ki',
    '代上':'1Ch','歷代上':'1Ch','歷代志上':'1Ch', 
    '代下':'2Ch','歷代下':'2Ch','歷代志下':'2Ch', 
    '拉':'Ezr','以斯拉':'Ezr','以斯拉記':'Ezr',
    '尼':'Neh','尼希米':'Neh','尼希米記':'Neh', 
    '斯':'Est','以斯帖':'Est','以斯帖記':'Est', 
    '伯':'Job','約伯':'Job','約伯記':'Job',
    '詩':'Psm','詩篇':'Psm', 
    '箴':'Pro','箴言':'Pro', 
    '傳':'Ecc','傳道':'Ecc','傳道書':'Ecc',
    '歌':'Son','雅歌':'Son', 
    '賽':'Isa','以賽亞':'Isa','以賽亞書':'Isa', 
    '耶':'Jer','耶利米':'Jer','耶利米書':'Jer',
    '哀':'Lam','耶利米哀':'Lam','耶利米哀歌':'Lam', 
    '結':'Eze','以西結':'Eze','以西結書':'Eze', 
    '但':'Dan','但以理':'Dan','但以理書':'Dan',
    '何':'Hos','何西阿':'Hos','何西阿書':'Hos', 
    '珥':'Joe','約珥':'Joe','約珥書':'Joe', 
    '摩':'Amo','阿摩司':'Amo','阿摩司書':'Amo',
    '俄':'Oba','俄巴底亞':'Oba','俄巴底亞書':'Oba', 
    '拿':'Jon','約拿':'Jon','約拿書':'Jon', 
    '彌':'Mic','彌迦':'Mic','彌迦書':'Mic',
    '鴻':'Nah','那鴻':'Nah','那鴻書':'Nah', 
    '哈':'Hab','哈巴谷':'Hab','哈巴谷書':'Hab', 
    '番':'Zep','西番雅':'Zep','西番雅書':'Zep',
    '該':'Hag','哈該':'Hag','哈該書':'Hag', 
    '亞':'Zec','撒迦利亞':'Zec','撒迦利亞書':'Zec', 
    '瑪':'Mal','瑪拉基':'Mal','瑪拉基書':'Mal',
    
    // 新約
    '太':'Mat','馬太':'Mat','馬太福音':'Mat', 
    '可':'Mak','馬可':'Mak','馬可福音':'Mak', 
    '路':'Luk','路加':'Luk','路加福音':'Luk',
    '約':'Jhn','約翰':'Jhn','約翰福音':'Jhn', 
    '徒':'Act','使徒':'Act','使徒行傳':'Act', 
    '羅':'Rom','羅馬':'Rom','羅馬書':'Rom',
    '林前':'1Co','哥林多前':'1Co','哥林多前書':'1Co', 
    '林後':'2Co','哥林多後':'2Co','哥林多後書':'2Co', 
    '加':'Gal','加拉太':'Gal','加拉太書':'Gal',
    '弗':'Eph','以弗所':'Eph','以弗所書':'Eph', 
    '腓':'Phl','腓立比':'Phl','腓立比書':'Phl', 
    '西':'Col','歌羅西':'Col','歌羅西書':'Col',
    '帖前':'1Ts','帖撒羅尼迦前':'1Ts','帖撒羅尼迦前書':'1Ts', 
    '帖後':'2Ts','帖撒羅尼迦後':'2Ts','帖撒羅尼迦後書':'2Ts', 
    '提前':'1Ti','提摩太前':'1Ti','提摩太前書':'1Ti',
    '提後':'2Ti','提摩太後':'2Ti','提摩太後書':'2Ti', 
    '多':'Tit','提多':'Tit','提多書':'Tit', 
    '門':'Phm','腓利門':'Phm','腓利門書':'Phm',
    '來':'Heb','希伯來':'Heb','希伯來書':'Heb', 
    '雅':'Jas','雅各':'Jas','雅各書':'Jas', 
    '彼前':'1Pe','彼得前':'1Pe','彼得前書':'1Pe',
    '彼後':'2Pe','彼得後':'2Pe','彼得後書':'2Pe', 
    '約一':'1Jn','約翰一':'1Jn','約翰一書':'1Jn', 
    '約二':'2Jn','約翰二':'2Jn','約翰二書':'2Jn',
    '約三':'3Jn','約翰三':'3Jn','約翰三書':'3Jn', 
    '猶':'Jud','猶大':'Jud','猶大書':'Jud', 
    '啟':'Rev','啟示':'Rev','啟示錄':'Rev'
  };

  const sortedBookNames = Object.keys(bookMap).sort((a, b) => b.length - a.length);

  let bibleData = [];
  let bibleReady = false;
  
  // 狀態
  let currentKeywordResults = [];
  let currentPage = 1;
  const ITEMS_PER_PAGE = 100;
  let currentIncludeKeywords = []; 
  
  // 選取區
  let selectedVerses = new Set();
  let currentRenderedData = [];

  window.addEventListener('load', () => {
    const searchInput = document.getElementById('searchInput');
    const keywordInput = document.getElementById('keywordInput');
    const keywordBtn = document.getElementById('keywordBtn');
    
    document.getElementById('result').innerHTML = '<span style="color:#888">資料庫載入中...</span>';

    searchInput.addEventListener('input', debounce(searchVerse, 300));
    keywordBtn.addEventListener('click', () => initKeywordSearch());
    keywordInput.addEventListener('keydown', e => { if (e.key === 'Enter') initKeywordSearch(); });
    document.getElementById('pageInput').addEventListener('keydown', e => { if (e.key === 'Enter') jumpToPage(); });

    loadCSVWithRetry();
  });

  async function loadCSVWithRetry(maxAttempts = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      try {
        const bust = (attempt === 1) ? '' : `?v=${Date.now()}`;
        const res = await fetch(`./bible.csv${bust}`, (attempt === 1) ? { cache: 'default' } : { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).replace(/^\uFEFF/, '');
        await parseCSVInWorker(text);
        bibleReady = true;
        document.getElementById('result').innerHTML = '';
        if (document.getElementById('searchInput').value.trim()) searchVerse();
        return;
      } catch (err) { lastErr = err; await delay(300 * attempt); }
    }
    document.getElementById('result').innerHTML = `<span style="color:red">資料載入失敗。</span>`;
  }

  function parseCSVInWorker(csvText) {
    return new Promise((resolve) => {
      const workerCode = `
        self.onmessage = (e) => {
          const lines = e.data.split(/\\r?\\n/);
          const out = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i]; if (!row) continue;
            const parts = row.split(',');
            if (parts.length >= 4) {
              out.push({
                book: parts[0].trim(),
                chapter: parts[1].trim(),
                verse: parts[2].trim(),
                text: parts.slice(3).join(',').trim()
              });
            }
          }
          postMessage(out);
        };
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob));
      worker.onmessage = (ev) => { bibleData = ev.data || []; worker.terminate(); resolve(); };
      worker.postMessage(csvText);
    });
  }

  // === 工具 ===
  function numToCn(numStr) {
    const n = parseInt(numStr);
    if (isNaN(n)) return numStr;
    const digits = ['零','一','二','三','四','五','六','七','八','九'];
    if (n <= 10) return n === 10 ? '十' : digits[n];
    if (n < 20) return '十' + digits[n % 10];
    if (n < 100) {
        const ten = Math.floor(n / 10);
        const unit = n % 10;
        return digits[ten] + '十' + (unit === 0 ? '' : digits[unit]);
    }
    if (n < 1000) { 
        if (n === 100) return '一百';
        if (n <= 150) {
            const h = Math.floor(n / 100);
            const rem = n % 100;
            const t = Math.floor(rem / 10);
            const u = rem % 10;
            let str = '一百';
            if (t > 0) str += digits[t] + '十';
            else if (u > 0) str += '零';
            if (u > 0) str += digits[u];
            return str;
        }
    }
    return numStr; 
  }

  function cnToNum(str) {
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    const map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10, '百':100 };
    if (!/[一二三四五六七八九十百]/.test(str)) return null;
    let num = 0, temp = 0; 
    for (let i = 0; i < str.length; i++) {
      const n = map[str[i]];
      if (n === undefined) continue;
      if (n === 100) { num += (temp === 0 ? 1 : temp) * 100; temp = 0; }
      else if (n === 10) { num += (temp === 0 ? 1 : temp) * 10; temp = 0; }
      else { temp = n; }
    }
    num += temp; return num;
  }

  // 更穩健的格式轉換
  function formatRef(englishBook, chapter, verse) {
      let shortBook = englishBook;
      try {
        const keys = Object.keys(bookMap).filter(k => bookMap[k] === englishBook);
        if (keys.length > 0) {
            keys.sort((a, b) => a.length - b.length);
            shortBook = keys[0];
        }
      } catch (e) {
        // Fallback to English ID if error
        shortBook = englishBook;
      }
      
      const cnChapter = numToCn(chapter);
      return `${shortBook}${cnChapter}${verse}`;
  }

  function parseSearchQuery(input) {
    input = input.replace(/\s+/g, '');
    let bookKey = null, remain = input;
    
    for (const key of sortedBookNames) {
      if (input.startsWith(key)) { bookKey = key; remain = input.substring(key.length); break; }
    }
    
    remain = remain.replace(/[.．。,，]/g, ':');
    let chapterStr = "", verseStr = null;
    if (remain.includes(':')) {
      [chapterStr, verseStr] = remain.split(':');
    } else {
      let splitIndex = -1;
      const isDigit = (c) => /[0-9]/.test(c);
      const isCnDigit = (c) => /[一二三四五六七八九十百]/.test(c);
      for (let i = 0; i < remain.length - 1; i++) {
         if (isCnDigit(remain[i]) && isDigit(remain[i+1])) { splitIndex = i + 1; break; }
      }
      if (splitIndex !== -1) { chapterStr = remain.substring(0, splitIndex); verseStr = remain.substring(splitIndex); }
      else { chapterStr = remain; }
    }
    const chapter = cnToNum(chapterStr) || parseInt(chapterStr);
    const verse = verseStr ? (cnToNum(verseStr) || parseInt(verseStr)) : null;
    return { book: bookKey ? bookMap[bookKey] : null, chineseBook: bookKey, chapter: chapter ? chapter.toString() : null, verse: verse ? verse.toString() : null };
  }

  // === 經文搜尋 ===
  function searchVerse() {
    const input = document.getElementById('searchInput').value.trim();
    const resultElement = document.getElementById('result');
    if (!bibleReady) return;
    resultElement.innerHTML = '';
    if (!input) return;

    const query = parseSearchQuery(input);
    let results = [];
    let title = "";

    if (query.book) {
       if (!query.chapter) return;
       results = bibleData.filter(e => e.book === query.book && e.chapter === query.chapter && (query.verse === null || e.verse === query.verse));
       
       const cBookName = Object.keys(bookMap).find(k => bookMap[k] === query.book) || query.chineseBook;
       if (results.length > 0 && !query.verse) title = `<div style="margin-bottom:10px; font-weight:bold; font-size:1.1rem">${cBookName} 第 ${query.chapter} 章</div>`;
    } else if (query.chapter && query.verse) {
        results = bibleData.filter(e => e.chapter === query.chapter && e.verse === query.verse);
        if (results.length > 0) title = `<div style="margin-bottom:10px; font-weight:bold; color:var(--primary-color)">全經卷搜尋：第 ${query.chapter} 章 第 ${query.verse} 節</div>`;
    }

    if (results.length > 0) {
      currentRenderedData = results; 
      let htmlBuffer = title;
      results.forEach((e, idx) => {
        const formattedRef = formatRef(e.book, e.chapter, e.verse);
        const key = JSON.stringify(e);
        const isSelected = selectedVerses.has(key) ? 'selected' : '';

        htmlBuffer += `
          <div class="result-item ${isSelected}" id="row-${idx}" onclick="toggleSelection(${idx})">
            <div>
              <span class="verse-ref">${formattedRef}</span>
              <span class="verse-text">${e.text}</span>
            </div>
            <div class="action-bar">
               <button class="copy-btn" onclick='copySingle(event, "${formattedRef} ${e.text}")'>
                 複製
               </button>
            </div>
          </div>
        `;
      });
      resultElement.innerHTML = htmlBuffer;
    } else {
      if (query.chapter) resultElement.innerHTML = '<div style="color:#999">查無經文。</div>';
    }
  }

  // === 關鍵字搜尋 ===
  function initKeywordSearch() {
    let input = document.getElementById('keywordInput').value.trim();
    if (!bibleReady) return;
    if (!input) { showToast('請輸入關鍵字'); return; }
    
    input = input.replace(/([^\s])-/g, '$1 -'); 

    const rawTokens = input.split(' ').filter(t => t.trim() !== '');
    const includes = [];
    const excludes = [];
    rawTokens.forEach(token => {
      if (token.startsWith('-') && token.length > 1) excludes.push(token.substring(1));
      else includes.push(token);
    });
    
    currentIncludeKeywords = includes;

    if (includes.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="color:red; text-align:center;">請至少輸入一個正向關鍵字</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }

    currentKeywordResults = [];
    for (const entry of bibleData) {
      if (!includes.every(key => entry.text.includes(key))) continue;
      if (excludes.some(key => entry.text.includes(key))) continue;
      currentKeywordResults.push(entry);
    }

    if (currentKeywordResults.length === 0) {
        document.getElementById('keywordResult').innerHTML = '<div style="padding:20px; text-align:center; color:#999">找不到相關經文。</div>';
        document.getElementById('paginationContainer').style.display = 'none';
        return;
    }
    currentPage = 1;
    document.getElementById('pageInput').value = 1; 
    renderKeywordPage();
  }

  function renderKeywordPage() {
      const container = document.getElementById('keywordResult');
      const totalItems = currentKeywordResults.length;
      const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
      const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalItems);
      
      const pageData = currentKeywordResults.slice(startIdx, endIdx);
      currentRenderedData = pageData; 

      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${currentIncludeKeywords.map(esc).join('|')})`, 'gi');

      let htmlBuffer = `<div style="padding:10px 0; color:#666;">共找到 ${totalItems} 筆資料</div>`;

      pageData.forEach((entry, idx) => {
        const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
        const formattedRef = formatRef(entry.book, entry.chapter, entry.verse); 

        const key = JSON.stringify(entry);
        const isSelected = selectedVerses.has(key) ? 'selected' : '';
        
        htmlBuffer += `
          <div class="result-item ${isSelected}" id="k-row-${idx}" onclick="toggleKeywordSelection(${idx})">
            <div class="verse-ref">${formattedRef}</div>
            <div class="verse-text">${highlightedText}</div>
             <div class="action-bar">
               <button class="copy-btn" onclick='copySingle(event, "${formattedRef} ${entry.text}")'>複製</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlBuffer;
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });

      if (totalPages > 1) {
          document.getElementById('paginationContainer').style.display = 'flex';
          document.getElementById('totalPagesDisplay').textContent = totalPages;
          document.getElementById('pageInput').max = totalPages;
      } else {
          document.getElementById('paginationContainer').style.display = 'none';
      }
  }
  
  // === 選取邏輯 ===
  function toggleSelection(idx) {
      const entry = currentRenderedData[idx];
      const key = JSON.stringify(entry);
      const row = document.getElementById(`row-${idx}`);
      handleToggle(key, row);
  }
  
  function toggleKeywordSelection(idx) {
      const entry = currentRenderedData[idx];
      const key = JSON.stringify(entry);
      const row = document.getElementById(`k-row-${idx}`);
      handleToggle(key, row);
  }
  
  function handleToggle(key, rowElement) {
      if (selectedVerses.has(key)) {
          selectedVerses.delete(key);
          rowElement.classList.remove('selected');
      } else {
          selectedVerses.add(key);
          rowElement.classList.add('selected');
      }
      updateFab();
  }

  function updateFab() {
      const fab = document.getElementById('fab');
      const count = selectedVerses.size;
      document.getElementById('fabText').textContent = `已選 ${count} 節`;
      
      if (count > 0) fab.classList.add('show');
      else fab.classList.remove('show');
  }
  
  function clearSelection() {
      selectedVerses.clear();
      document.querySelectorAll('.result-item.selected').forEach(el => el.classList.remove('selected'));
      updateFab();
  }

  // === 複製核心修正 (同步執行) ===
  function copySelectedVerses() {
      if (selectedVerses.size === 0) return;
      
      let textBuffer = [];
      // 容錯機制：遇到錯誤資料只跳過該節，不中斷
      selectedVerses.forEach(jsonStr => {
          try {
            const e = JSON.parse(jsonStr);
            const formattedRef = formatRef(e.book, e.chapter, e.verse);
            textBuffer.push(`${formattedRef} ${e.text}`);
          } catch(err) {
            console.warn("Skipped invalid verse data");
          }
      });

      if (textBuffer.length > 0) {
        copyToClipboard(textBuffer.join('\n'));
        clearSelection();
      }
  }

  function copySingle(e, text) {
      e.stopPropagation();
      copyToClipboard(text);
  }

  function jumpToPage() {
      const input = document.getElementById('pageInput');
      const totalPages = Math.ceil(currentKeywordResults.length / ITEMS_PER_PAGE);
      let val = parseInt(input.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > totalPages) val = totalPages;
      currentPage = val;
      input.value = val; 
      renderKeywordPage();
  }

  window.jumpToPage = jumpToPage;
  window.copySingle = copySingle;
  window.copySelectedVerses = copySelectedVerses;
  window.toggleSelection = toggleSelection;
  window.toggleKeywordSelection = toggleKeywordSelection;
  window.clearSelection = clearSelection;

  // 統一複製函式：優先嘗試 Clipboard API，失敗則退回 execCommand (同步)
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => showToast('已複製'))
        .catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = 0;
      document.body.appendChild(ta);
      ta.select();
      try {
        const successful = document.execCommand('copy');
        showToast(successful ? '已複製' : '複製失敗');
      } catch (err) {
        showToast('複製失敗');
      }
      document.body.removeChild(ta);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show';
    setTimeout(() => { t.className = t.className.replace('show', ''); }, 3000);
  }
  function debounce(fn, w = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), w); }; }
  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
