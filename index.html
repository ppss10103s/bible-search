<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦咻咻查聖經✦</title>
  <!-- 避免瀏覽器自動請求 /favicon.ico 造成 404 -->
  <link rel="icon" href="data:,">
  <style>
    .highlight { background-color: yellow; }
    .copy-button {
      margin-left: 10px; cursor: pointer; color: blue; text-decoration: underline;
    }
    .alert {
      padding: 10px; background-color: #4CAF50; color: white; opacity: 1;
      transition: opacity 0.6s; margin-bottom: 15px;
    }
    .closebtn {
      margin-left: 15px; color: white; font-weight: bold; float: right;
      font-size: 22px; line-height: 20px; cursor: pointer; transition: 0.3s;
    }
    .closebtn:hover { color: black; }
  </style>
</head>
<body>
  <h1>✦咻咻查聖經✦</h1>
  <p>＊輸入經文參考，如：太2.1、賽50:1、詩23</p>
  <p>＊關鍵字如要同時搜不同關鍵字可用空格區隔</p>

  <input type="text" id="searchInput" placeholder="輸入經文參考">
  <p id="result"></p>

  <input type="text" id="keywordInput" placeholder="輸入關鍵字">
  <button id="keywordBtn">搜索關鍵字</button>
  <div id="keywordResult"></div>

  <script>
    // === 卷名對照 ===
    const bookMap = {
      '創':'Gen','創世記':'Gen',
      '出':'Exo','出埃及記':'Exo',
      '利':'Lev','利未記':'Lev',
      '民':'Num','民數記':'Num',
      '申':'Deu','申命記':'Deu',
      '書':'Jos','約書亞記':'Jos',
      '士':'Jug','士師記':'Jug',
      '得':'Rut','路得記':'Rut',
      '撒上':'1Sa','撒母耳記上':'1Sa',
      '撒下':'2Sa','撒母耳記下':'2Sa',
      '王上':'1Ki','列王記上':'1Ki',
      '王下':'2Ki','列王記下':'2Ki',
      '代上':'1Ch','歷代志上':'1Ch',
      '代下':'2Ch','歷代志下':'2Ch',
      '拉':'Ezr','以斯拉記':'Ezr',
      '尼':'Neh','尼希米記':'Neh',
      '斯':'Est','以斯帖記':'Est',
      '伯':'Job','約伯記':'Job',
      '詩':'Psm','詩篇':'Psm',
      '箴':'Pro','箴言':'Pro',
      '傳':'Ecc','傳道書':'Ecc',
      '歌':'Son','雅歌':'Son',
      '賽':'Isa','以賽亞書':'Isa',
      '耶':'Jer','耶利米書':'Jer',
      '哀':'Lam','耶利米哀歌':'Lam',
      '結':'Eze','以西結書':'Eze',
      '但':'Dan','但以理書':'Dan',
      '何':'Hos','何西阿書':'Hos',
      '珥':'Joe','約珥書':'Joe',
      '摩':'Amo','阿摩司書':'Amo',
      '俄':'Oba','俄巴底亞書':'Oba',
      '拿':'Jon','約拿書':'Jon',
      '彌':'Mic','彌迦書':'Mic',
      '鴻':'Nah','那鴻書':'Nah',
      '哈':'Hab','哈巴谷書':'Hab',
      '番':'Zep','西番雅書':'Zep',
      '該':'Hag','哈該書':'Hag',
      '亞':'Zec','撒迦利亞書':'Zec',
      '瑪':'Mal','瑪拉基書':'Mal',
      '太':'Mat','馬太福音':'Mat',
      '可':'Mak','馬可福音':'Mak',  // 確認你的 CSV 也用 Mak
      '路':'Luk','路加福音':'Luk',
      '約':'Jhn','約翰福音':'Jhn',
      '徒':'Act','使徒行傳':'Act',
      '羅':'Rom','羅馬書':'Rom',
      '林前':'1Co','哥林多前書':'1Co',
      '林後':'2Co','哥林多後書':'2Co',
      '加':'Gal','加拉太書':'Gal',
      '弗':'Eph','以弗所書':'Eph',
      '腓':'Phl','腓立比書':'Phl',
      '西':'Col','歌羅西書':'Col',
      '帖前':'1Ts','帖撒羅尼迦前書':'1Ts',
      '帖後':'2Ts','帖撒羅尼迦後書':'2Ts',
      '提前':'1Ti','提摩太前書':'1Ti',
      '提後':'2Ti','提摩太後書':'2Ti',
      '多':'Tit','提多書':'Tit',
      '門':'Phm','腓利門書':'Phm',
      '來':'Heb','希伯來書':'Heb',
      '雅':'Jas','雅各書':'Jas',
      '彼前':'1Pe','彼得前書':'1Pe',
      '彼後':'2Pe','彼得後書':'2Pe',
      '約一':'1Jn','約翰一書':'1Jn',
      '約二':'2Jn','約翰二書':'2Jn',
      '約三':'3Jn','約翰三書':'3Jn',
      '猶':'Jud','猶大書':'Jud',
      '啟':'Rev','啟示錄':'Rev'
    };

    let bibleData = [];
    let bibleReady = false;
    let loadingError = null;

    // ====== 啟動：先綁事件，再載 CSV ======
    window.addEventListener('load', () => {
      const searchInput = document.getElementById('searchInput');
      const keywordInput = document.getElementById('keywordInput');
      const keywordBtn   = document.getElementById('keywordBtn');

      // 經文搜尋：輸入時延遲觸發
      searchInput.addEventListener('input', debounce(searchVerse, 200));

      // 關鍵字搜尋：按鈕或 Enter 觸發
      keywordBtn.addEventListener('click', searchKeyword);
      keywordInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') searchKeyword();
      });

      document.getElementById('result').textContent = '資料載入中…';
      loadCSVWithRetry(); // 開始載 CSV
    });

    // ====== CSV 載入（含重試與避開快取） ======
    async function loadCSVWithRetry(maxAttempts = 3) {
      let lastErr;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          const bust = (attempt === 1) ? '' : `?v=${Date.now()}`; // 第二次起加參數
          const res = await fetch(`./bible.csv${bust}`, {
            cache: 'no-store',
            headers: { 'cache-control': 'no-cache', 'pragma': 'no-cache' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = (await res.text()).replace(/^\uFEFF/, ''); // 去 BOM
          parseCSV(text);
          bibleReady = true;
          loadingError = null;

          // 若使用者已輸入，就自動跑一次；否則清掉「載入中」
          if (document.getElementById('searchInput').value.trim()) {
            searchVerse();
          } else {
            document.getElementById('result').textContent = '';
          }
          return;
        } catch (err) {
          lastErr = err;
          await delay(300 * attempt); // 指數回退
        }
      }
      // 全部失敗
      bibleReady = false;
      loadingError = lastErr?.message || '載入失敗';
      document.getElementById('result').textContent =
        '載入聖經資料失敗（可能是暫時性網路或快取問題）。請重新整理或稍後再試。';
    }

    function parseCSV(data) {
      const lines = data.split(/\r?\n/);
      bibleData = [];
      // 預設第一行是表頭：book,chapter,verse,text
      for (let i = 1; i < lines.length; i++) {
        const row = lines[i];
        if (!row) continue;
        const parts = row.split(',');
        if (parts.length >= 4) {
          bibleData.push({
            book:    parts[0].trim(),
            chapter: parts[1].trim(),
            verse:   parts[2].trim(),
            text:    parts.slice(3).join(',').trim() // 內文若含逗號，用 join 還原
          });
        }
      }
    }

    // ====== 經文搜尋 ======
    function searchVerse() {
      const input = document.getElementById('searchInput').value.trim();
      const resultElement = document.getElementById('result');

      if (!bibleReady) {
        resultElement.textContent = loadingError ? ('資料尚未就緒：' + loadingError) : '資料載入中…';
        return;
      }
      resultElement.innerHTML = '';

      if (!input) return;
      if (input.includes(' ')) { resultElement.textContent = '輸入格式錯誤。'; return; }

      // 修正：不要把 | 放進字元集合
      const regex = /^(\D{1,4})(\d+)[章:.．]?(\d+)?$/;
      const match = input.match(regex);
      if (!match) { resultElement.textContent = '查無此卷、章或節。'; return; }

      const chineseBook = match[1].trim();
      const chapter = match[2].trim();
      const verse = match[3] ? match[3].trim() : null;
      const englishBook = bookMap[chineseBook];

      if (!englishBook) { resultElement.textContent = '查無此卷。'; return; }

      let resultText = '';
      if (verse === null) {
        bibleData.forEach(e => {
          if (e.book === englishBook && e.chapter === chapter) {
            resultText += `${e.verse}. ${e.text} `;
          }
        });
      } else {
        bibleData.some(e => {
          if (e.book === englishBook && e.chapter === chapter && e.verse === verse) {
            resultText = e.text; return true;
          }
          return false;
        });
      }

      if (resultText) {
        resultElement.innerHTML = resultText;
        if (verse !== null) {
          // 用 JSON.stringify 避免引號造成 HTML 斷裂
          resultElement.innerHTML +=
            `<span class="copy-button" onclick='copyToClipboard(${JSON.stringify(resultText)})'>複製</span>`;
        }
      } else {
        resultElement.textContent = '查無此經文。';
      }
    }

    // ====== 關鍵字搜尋 ======
    function searchKeyword() {
      const input = document.getElementById('keywordInput').value.trim();
      const resultElement = document.getElementById('keywordResult');

      if (!bibleReady) {
        resultElement.textContent = loadingError ? ('資料尚未就緒：' + loadingError) : '資料載入中…';
        return;
      }
      resultElement.innerHTML = '';
      if (!input) { resultElement.textContent = '請輸入關鍵字。'; return; }

      const keywords = input.split(' ').filter(Boolean);
      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${keywords.map(esc).join('|')})`, 'gi');

      let results = '';
      let count = 0;
      bibleData.forEach(entry => {
        if (keywords.every(k => entry.text.includes(k))) {
          count++;
          const highlightedText = entry.text.replace(regex, '<span class="highlight">$1</span>');
          const chineseBook = Object.keys(bookMap).find(k => bookMap[k] === entry.book) || entry.book;
          results += `<p>${chineseBook} ${entry.chapter}:${entry.verse} - ${highlightedText}` +
                     `<span class="copy-button" onclick='copyToClipboard(${JSON.stringify(entry.text)})'>複製</span></p>`;
        }
      });

      resultElement.innerHTML = results
        ? `<p>總共找到 ${count} 個經文包含此關鍵字。</p>${results}`
        : '查無此關鍵字。';
    }

    // ====== 工具函式 ======
    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showAlert('經文已複製');
    }

    function showAlert(message) {
      const alertBox = document.createElement('div');
      alertBox.className = 'alert';
      alertBox.innerHTML = message +
        '<span class="closebtn" onclick="this.parentElement.style.display=\'none\';">&times;</span>';
      document.body.appendChild(alertBox);
      setTimeout(() => {
        alertBox.style.opacity = '0';
        setTimeout(() => document.body.removeChild(alertBox), 600);
      }, 2000);
    }

    function debounce(fn, wait = 200) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), wait); };
    }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>
</body>
</html>
